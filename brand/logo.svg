<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3F6F8"/>
      <stop offset="1" stop-color="#AEBBC5"/>
    </linearGradient>
    <linearGradient id="broomGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DEE4E8"/>
    </linearGradient>
  </defs>

  <!-- chip body -->
  <rect x="96" y="96" width="320" height="320" rx="46" fill="url(#chipGrad)" stroke="#8B9BA8" stroke-width="7"/>

  <!-- pins -->
  <g fill="url(#chipGrad)" stroke="#8B9BA8" stroke-width="3">
    <rect x="134" y="74" width="16" height="22" rx="3"/>
    <rect x="179" y="74" width="16" height="22" rx="3"/>
    <rect x="225" y="74" width="16" height="22" rx="3"/>
    <rect x="271" y="74" width="16" height="22" rx="3"/>
    <rect x="317" y="74" width="16" height="22" rx="3"/>
    <rect x="362" y="74" width="16" height="22" rx="3"/>

    <rect x="134" y="416" width="16" height="22" rx="3"/>
    <rect x="179" y="416" width="16" height="22" rx="3"/>
    <rect x="225" y="416" width="16" height="22" rx="3"/>
    <rect x="271" y="416" width="16" height="22" rx="3"/>
    <rect x="317" y="416" width="16" height="22" rx="3"/>
    <rect x="362" y="416" width="16" height="22" rx="3"/>

    <rect x="74" y="134" width="22" height="16" rx="3"/>
    <rect x="74" y="179" width="22" height="16" rx="3"/>
    <rect x="74" y="225" width="22" height="16" rx="3"/>
    <rect x="74" y="271" width="22" height="16" rx="3"/>
    <rect x="74" y="317" width="22" height="16" rx="3"/>
    <rect x="74" y="362" width="22" height="16" rx="3"/>

    <rect x="416" y="134" width="22" height="16" rx="3"/>
    <rect x="416" y="179" width="22" height="16" rx="3"/>
    <rect x="416" y="225" width="22" height="16" rx="3"/>
    <rect x="416" y="271" width="22" height="16" rx="3"/>
    <rect x="416" y="317" width="22" height="16" rx="3"/>
    <rect x="416" y="362" width="22" height="16" rx="3"/>
  </g>

  <!-- circuit traces -->
  <g fill="none" stroke="#C7D2D8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M438 233 L392 233 L392 300 L340 300"/>
    <path d="M187 438 L187 388 L245 388"/>
  </g>
  <g fill="#3E6E96" stroke="#2C5476" stroke-width="2">
    <circle cx="392" cy="233" r="7"/>
    <circle cx="340" cy="300" r="9"/>
    <circle cx="187" cy="388" r="7"/>
    <circle cx="245" cy="388" r="9"/>
  </g>

  <!-- broom -->
  <line x1="166.97" y1="342.83" x2="338" y2="168" stroke="#B9C3CB" stroke-width="24" stroke-linecap="round"/>
  <line x1="166.97" y1="342.83" x2="338" y2="168" stroke="url(#broomGrad)" stroke-width="18" stroke-linecap="round"/>
  <polygon points="175.6,351.2 161.1,427.7 82.3,351.1 158.4,334.4" fill="url(#broomGrad)" stroke="#9FACB6" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#B7C2CA" stroke-width="3" stroke-linecap="round">
    <line x1="162.7" y1="338.6" x2="102.0" y2="370.2"/>
    <line x1="167.0" y1="342.8" x2="121.7" y2="389.4"/>
    <line x1="171.3" y1="347.0" x2="141.4" y2="408.6"/>
  </g>

  <!-- target -->
  <circle cx="345" cy="195" r="28" fill="#3E6E96" stroke="#2C5476" stroke-width="3"/>
  <circle cx="345" cy="195" r="28" fill="none" stroke="#4FD873" stroke-width="10"/>
  <g stroke="#4FD873" stroke-width="8" stroke-linecap="round">
    <line x1="345" y1="161" x2="345" y2="149"/>
    <line x1="345" y1="229" x2="345" y2="241"/>
    <line x1="311" y1="195" x2="299" y2="195"/>
    <line x1="379" y1="195" x2="391" y2="195"/>
  </g>
  <circle cx="345" cy="195" r="9" fill="#4FD873"/>
</svg>
