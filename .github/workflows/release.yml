name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build Release app
        run: make build-release
      - name: Package DMG
        run: make dmg
      - name: Create GitHub Release and attach DMG + checksum
        run: gh release create "${{ github.ref_name }}" build/Pidlyse.dmg build/Pidlyse.dmg.sha256 --title "${{ github.ref_name }}" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
