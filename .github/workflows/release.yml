name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build Release app
        run: make build-release
      - name: Package DMG
        run: make dmg
      - name: Create GitHub Release and attach DMG + checksum
        run: gh release create "$REF_NAME" build/Pidlyse.dmg build/Pidlyse.dmg.sha256 --title "$REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
