name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release app
        run: make build-release
      - name: Package DMG
        run: make dmg
      - name: Create GitHub Release and attach DMG + checksum
        run: gh release create "${{ github.ref_name }}" build/Pidly.dmg build/Pidly.dmg.sha256 --title "${{ github.ref_name }}" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
