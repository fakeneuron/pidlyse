name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.30.1'
          # darwin_arm64 tarball's SHA-256 from the release's gitleaks_<version>_checksums.txt; update with GITLEAKS_VERSION
          GITLEAKS_SHA256: 'b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5'
        run: |
          TARBALL="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSL -o "$TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | shasum -a 256 -c -
          tar -xz -C "$RUNNER_TEMP" -f "$TARBALL" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact
      - name: Run app test suite
        run: make test-app
      - name: Run PidlyseCore tests
        run: swift test --package-path Packages/PidlyseCore
      - name: Build CLI
        run: make build-cli
